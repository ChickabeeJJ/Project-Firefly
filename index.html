<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Project Firefly</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d0f12; overflow: hidden; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; }
      /* Wide phones: the 16:9 stage is framed by a soft, blurred echo of the current screen. */
      #backdrop { position: fixed; inset: -40px; background: #0d0f12 center / cover no-repeat;
        filter: blur(20px) brightness(0.62) saturate(0.95); transition: background-image 0.6s; }
      #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
        background: #0d0f12; color: #e8dcc0; font-family: Georgia, serif; font-size: 18px; padding: 24px; z-index: 10; }
      @media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
      /* Shown from the very first paint until the game draws its own loading screen. */
      #boot { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        background: #06070a url('boot.jpg') center / cover no-repeat; color: #e8dcc0; font-family: Georgia, 'Times New Roman', serif; }
      #boot::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 45%, rgba(0,0,0,0.85)); }
      #boot .t { position: relative; font-size: clamp(28px, 5vw, 64px); letter-spacing: 0.32em; text-indent: 0.32em; margin-bottom: 1.2vh; }
      #boot .s { position: relative; font-style: italic; font-size: clamp(13px, 1.6vw, 20px); opacity: 0.75; margin-bottom: 2.4vh; }
      #boot .bar { position: relative; width: min(46vw, 560px); height: 2px; background: rgba(232,220,192,0.18); margin-bottom: 9vh; overflow: hidden; }
      #boot .bar i { position: absolute; top: 0; bottom: 0; width: 30%; background: #e8c27a; animation: boot 1.4s ease-in-out infinite; }
      @keyframes boot { from { left: -30%; } to { left: 100%; } }
    </style>
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  </head>
  <body>
    <div id="backdrop"></div>
    <div id="game"></div>
    <div id="boot"><div class="t">FIREFLY</div><div class="s">Lighting the lamps of Vellmoor…</div><div class="bar"><i></i></div></div>
    <div id="rotate"><div>Turn your device sideways<br />to keep the lanterns lit.</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
