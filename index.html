<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Project Firefly</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d0f12; overflow: hidden; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; }
      /* Wide phones and tablets: the 16:9 stage is framed by a soft, blurred copy of the loading painting. */
      #backdrop { position: fixed; inset: -40px; background: #0d0f12 url('boot.jpg') center / cover no-repeat;
        filter: blur(20px) brightness(0.62) saturate(0.95); transition: background-image 0.6s; }
      #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
        background: #0d0f12; color: #e8dcc0; font-family: Georgia, serif; font-size: 18px; padding: 24px; z-index: 10; }
      @media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
      /* The loading screen, from the very first paint: a 16:9 frame fitted like the game's canvas. */
      #boot { position: fixed; inset: 0; z-index: 5; background: #06070a; transition: opacity 0.6s ease;
        --u: calc(min(100vw, 177.78vh) / 1920); font-family: Spectral, Georgia, 'Times New Roman', serif; color: #e8dcc0; }
      #boot .frame { position: absolute; left: 50%; top: 50%; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; transform: translate(-50%, -50%);
        background: url('boot.jpg') center / cover no-repeat; overflow: hidden; }
      #boot .frame::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--u) * 420);
        background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.88)); }
      #boot .ver { position: absolute; left: calc(var(--u) * 34); top: calc(var(--u) * 26); font-size: calc(var(--u) * 20); opacity: 0.55; z-index: 1; }
      #boot .lore { position: absolute; left: calc(var(--u) * 120); bottom: calc(var(--u) * 150); width: calc(var(--u) * 1400); z-index: 1; text-shadow: 0 2px 6px #000; }
      #boot .lore h1 { margin: 0; font-weight: 400; font-size: calc(var(--u) * 40); letter-spacing: 0.02em; display: inline-block;
        padding-right: calc(var(--u) * 60); border-bottom: 1px solid rgba(232,220,192,0.45); padding-bottom: calc(var(--u) * 10); }
      #boot .lore p { margin: calc(var(--u) * 16) 0 0; font-size: calc(var(--u) * 26); line-height: 1.45; opacity: 0.92; }
      #boot .track { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 70); height: 2px; background: rgba(232,220,192,0.18); z-index: 1; }
      #boot .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 2%; background: #f2e2c0; box-shadow: 0 0 8px #ffe6b0; transition: width 0.25s ease-out; }
      #boot .status { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 26); text-align: center; font-size: calc(var(--u) * 20); opacity: 0.7; z-index: 1; }
    </style>
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  </head>
  <body>
    <div id="backdrop"></div>
    <div id="game"></div>
    <div id="boot"><div class="frame">
      <div class="ver">Project Firefly · V1.0</div>
      <div class="lore"><h1></h1><p></p></div>
      <div class="track bar"><i></i></div>
      <div class="status">Trimming the wicks · please wait …</div>
    </div></div>
    <script>
      (function () {
        var lore = [{"t": "Project Firefly", "x": "A secret scheme pencilled on the back of an envelope no one has opened: every time somebody is forgotten, a firefly goes up. Catch them all, and keep them safe until the morning can find them."}, {"t": "The Thirteenth Stroke", "x": "At midnight on the last night of 1929 the Cathedral Clock struck twelve, and then once more. There is no thirteenth hour. That night, Vellmoor found one."}, {"t": "The Dimming", "x": "What the fog swallows, the world forgets: faces, names, whole streets. Even the letters people wrote to one another fade to blank paper."}, {"t": "Luminaries", "x": "A few people remembered too fiercely to be forgotten. Their memories still glow — enough to light a lantern, or to burn a hole in the dark."}, {"t": "Corvid Lane", "x": "Every street lamp in Vellmoor had a name, and every name had a lamp. On Corvid Lane the crows still fly their old postal routes, carrying letters no one remembers sending."}, {"t": "The Lighthouse", "x": "Out on the breakwater the old lighthouse still burns. Since midnight its beam has turned around. It shines darkness out to sea, and the tide has not come in."}, {"t": "Wick Dust", "x": "Ash from a wick that burned through the Dimming still remembers being light. Feed it to a Luminary and they grow brighter."}];
        var l = lore[Math.floor(Math.random() * lore.length)];
        var b = document.getElementById('boot');
        b.querySelector('h1').textContent = l.t;
        b.querySelector('p').textContent = l.x;
      })();
    </script>
    <div id="rotate"><div>Turn your device sideways<br />to keep the lanterns lit.</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
