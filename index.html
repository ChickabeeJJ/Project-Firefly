<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Firefly Nocturne</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d0f12; overflow: hidden; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #d9c9a3; font-family: Georgia, 'Times New Roman', serif; letter-spacing: 0.3em; font-size: 14px; pointer-events: none; }
      #boot .bar { width: 160px; height: 1px; background: #3a3329; margin-top: 14px; overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 30%; background: #d98b4a; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
      #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
        background: #0d0f12; color: #e8dcc0; font-family: Georgia, serif; font-size: 18px; padding: 24px; z-index: 10; }
      @media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
    </style>
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">LIGHTING THE LAMPS<div class="bar"><i></i></div></div>
    <div id="rotate"><div>Turn your device sideways<br />to keep the lanterns lit.</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
