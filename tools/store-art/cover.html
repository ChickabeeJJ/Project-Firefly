<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Cinzel;src:url(src/cinzel-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Cinzel;src:url(src/cinzel-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:CinzelDeco;src:url(src/cinzel-decorative-latin-900-normal.woff2);font-weight:900}
@font-face{font-family:CinzelDeco;src:url(src/cinzel-decorative-latin-700-normal.woff2);font-weight:700}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body><canvas id="c"></canvas><script>
// Gacha-style key art: one hero large and cropped, the troupe behind in depth, god rays,
// bokeh and drifting letters, and an emblem logo. Title text only (CrazyGames cover rules).
const q = new URLSearchParams(location.search);
const W = +q.get('w'), H = +q.get('h'), L = q.get('l');
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const x = cv.getContext('2d'); x.imageSmoothingQuality = 'high';
const load = (n) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = 'src/' + n + '.webp'; });
const rnd = (s) => () => (s = (s * 16807) % 2147483647) / 2147483647;
function layer(fn) { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; fn(g); return c; }
function coverImg(g, img, ax, ay, zoom = 1) {
  const s = Math.max(W / img.width, H / img.height) * zoom, w = img.width * s, h = img.height * s;
  g.drawImage(img, (W - w) * ax, (H - h) * ay, w, h);
}
function rg(g, cx, cy, r, stops) { const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r); stops.forEach(([o, c]) => gr.addColorStop(o, c)); g.fillStyle = gr; g.fillRect(cx - r, cy - r, r * 2, r * 2); }
// A figure: height in px, anchored by the top of its head (fraction of art height) so heads line up predictably.
function hero(img, faceX, faceY, h, opts) { const w = img.width * h / img.height; fig(img, faceX - (0.572 - 0.5) * w, faceY - 0.2 * h, h, opts); }
function fig(img, cx, topY, h, { blur = 0, dim = 1, haze = 0, rim = 0, rimLeft = true, flip = false } = {}) {
  const s = h / img.height, w = img.width * s;
  const o = document.createElement('canvas'); o.width = Math.ceil(w); o.height = Math.ceil(h);
  const g = o.getContext('2d'); g.imageSmoothingQuality = 'high';
  if (flip) { g.translate(w, 0); g.scale(-1, 1); }
  g.drawImage(img, 0, 0, w, h);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  if (haze) { g.fillStyle = `rgba(18,30,46,${haze})`; g.fillRect(0, 0, w, h); }
  if (rim) {
    const gr = g.createLinearGradient(rimLeft ? 0 : w, 0, rimLeft ? w * 0.4 : w * 0.6, 0);
    gr.addColorStop(0, `rgba(255,200,120,${rim})`); gr.addColorStop(1, 'rgba(255,200,120,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }
  const x0 = cx - w / 2;
  x.save(); x.filter = `blur(${Math.round(h * 0.02)}px) brightness(0)`; x.globalAlpha = 0.5; x.drawImage(o, x0 + h * 0.012, topY + h * 0.01); x.restore();
  x.save(); x.filter = `${blur ? `blur(${blur}px) ` : ''}brightness(${dim})`; x.drawImage(o, x0, topY); x.restore();
}
function rays(cx, cy, n, len, spread, alpha, seed) {
  const r = rnd(seed);
  x.save(); x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const a = Math.PI / 2 + (r() - 0.5) * spread, w = 30 + r() * 110;
    x.save(); x.translate(cx, cy); x.rotate(a - Math.PI / 2);
    const g = x.createLinearGradient(0, 0, 0, len); g.addColorStop(0, `rgba(255,226,170,${alpha * (0.4 + r() * 0.6)})`); g.addColorStop(1, 'rgba(255,226,170,0)');
    x.fillStyle = g; x.beginPath(); x.moveTo(-w * 0.15, 0); x.lineTo(w * 0.15, 0); x.lineTo(w, len); x.lineTo(-w, len); x.closePath(); x.fill(); x.restore();
  }
  x.restore();
}
function fireflies(n, seed, area, k, bokeh) {
  const r = rnd(seed); x.save(); x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const px = area[0] + r() * area[2], py = area[1] + r() * area[3];
    if (bokeh) { const s = (30 + r() * 70) * k; rg(x, px, py, s, [[0, 'rgba(230,240,150,0.32)'], [0.7, 'rgba(220,235,140,0.18)'], [1, 'rgba(220,235,140,0)']]); }
    else { const s = (0.5 + r()) * k; rg(x, px, py, 16 * s, [[0, 'rgba(220,240,120,0.4)'], [1, 'rgba(220,240,120,0)']]); rg(x, px, py, 4.5 * s, [[0, 'rgba(255,255,225,1)'], [1, 'rgba(255,255,225,0)']]); }
  }
  x.restore();
}
function letters(img, n, seed, area, k, blur) {
  const r = rnd(seed);
  for (let i = 0; i < n; i++) {
    const px = area[0] + r() * area[2], py = area[1] + r() * area[3], s = (70 + r() * 70) * k;
    x.save(); x.translate(px, py); x.rotate((r() - 0.5) * 1.6); x.filter = `blur(${blur}px) brightness(0.8)`; x.globalAlpha = 0.85;
    x.drawImage(img, -s / 2, -s / 2, s, s); x.restore();
  }
}
function logo(cx, cy, k, lantern) {
  x.save(); x.textAlign = 'center'; x.textBaseline = 'middle';
  // Emblem: the lantern in a gilt ring with sunburst ticks, firefly at its heart.
  const R = 74 * k;
  x.save(); x.globalCompositeOperation = 'lighter'; rg(x, cx, cy - 120 * k, 300 * k, [[0, 'rgba(255,200,110,0.42)'], [1, 'rgba(255,200,110,0)']]); x.restore();
  x.save(); x.translate(cx, cy - 210 * k);
  x.strokeStyle = 'rgba(232,196,110,0.95)'; x.lineWidth = 2.4 * k; x.beginPath(); x.arc(0, 0, R, 0, Math.PI * 2); x.stroke();
  x.lineWidth = 1 * k; x.strokeStyle = 'rgba(232,196,110,0.6)'; x.beginPath(); x.arc(0, 0, R + 9 * k, 0, Math.PI * 2); x.stroke();
  for (let i = 0; i < 24; i++) { const a = (i / 24) * Math.PI * 2, l = i % 2 ? 10 : 20; x.beginPath(); x.moveTo(Math.cos(a) * (R + 12 * k), Math.sin(a) * (R + 12 * k)); x.lineTo(Math.cos(a) * (R + (12 + l) * k), Math.sin(a) * (R + (12 + l) * k)); x.stroke(); }
  x.fillStyle = 'rgba(14,10,8,0.7)'; x.beginPath(); x.arc(0, 0, R - 3 * k, 0, Math.PI * 2); x.fill();
  { const ls = (R * 1.5) / 330; x.drawImage(lantern, -215 * ls, -183 * ls, 360 * ls, 360 * ls); }
  x.restore();
  // Engraved gilt lettering: a deep shadow, a dark keyline, a bevelled gold face and a fine highlight.
  const word = (txt, y, sz, sp, family, weight) => {
    x.font = `${weight} ${sz}px ${family}`; x.letterSpacing = sp + 'px'; x.lineJoin = 'round';
    x.save(); x.shadowColor = 'rgba(0,0,0,0.85)'; x.shadowBlur = sz * 0.22; x.shadowOffsetY = sz * 0.06;
    x.lineWidth = sz * 0.2; x.strokeStyle = '#120a05'; x.strokeText(txt, cx, y); x.restore();
    x.lineWidth = sz * 0.1; x.strokeStyle = '#6a4518'; x.strokeText(txt, cx, y);
    x.save(); x.shadowColor = 'rgba(255,196,110,0.6)'; x.shadowBlur = sz * 0.3;
    const g = x.createLinearGradient(0, y - sz * 0.5, 0, y + sz * 0.45);
    g.addColorStop(0, '#fffdf0'); g.addColorStop(0.3, '#f8e6b0'); g.addColorStop(0.5, '#d9a54c'); g.addColorStop(0.56, '#a8702a'); g.addColorStop(0.8, '#e6bf6a'); g.addColorStop(1, '#fff0c0');
    x.fillStyle = g; x.fillText(txt, cx, y); x.restore();
    x.save(); x.globalCompositeOperation = 'lighter'; x.lineWidth = Math.max(1, sz * 0.012); x.strokeStyle = 'rgba(255,250,225,0.5)'; x.strokeText(txt, cx, y - sz * 0.01); x.restore();
  };
  word('FIREFLY', cy + 34 * k, 158 * k, 6 * k, 'CinzelDeco', 900);
  // PROJECT, small and widely spaced, between two fine rules.
  word('PROJECT', cy - 96 * k, 40 * k, 30 * k, 'Cinzel', 700);
  x.save(); x.font = `700 ${40 * k}px Cinzel`; x.letterSpacing = 30 * k + 'px';
  const pw = x.measureText('PROJECT').width / 2 + 36 * k; x.restore();
  for (const sgn of [-1, 1]) {
    const gl = x.createLinearGradient(cx + sgn * pw, 0, cx + sgn * (pw + 150 * k), 0); gl.addColorStop(0, 'rgba(240,214,146,0.95)'); gl.addColorStop(1, 'rgba(240,214,146,0)');
    x.fillStyle = gl; x.fillRect(Math.min(cx + sgn * pw, cx + sgn * (pw + 150 * k)), cy - 98 * k, 150 * k, 2 * k);
  }
  // Flourish rule under the title.
  const ry = cy + 120 * k, rw = 330 * k;
  const gr = x.createLinearGradient(cx - rw, 0, cx + rw, 0); gr.addColorStop(0, 'rgba(232,196,110,0)'); gr.addColorStop(0.5, 'rgba(240,214,146,1)'); gr.addColorStop(1, 'rgba(232,196,110,0)');
  x.fillStyle = gr; x.fillRect(cx - rw, ry - 1.5 * k, rw * 2, 3 * k);
  x.fillStyle = '#f2d892'; for (const dx of [-rw * 0.62, 0, rw * 0.62]) { const s = dx ? 6 * k : 10 * k; x.beginPath(); x.moveTo(cx + dx, ry - s); x.lineTo(cx + dx + s, ry); x.lineTo(cx + dx, ry + s); x.lineTo(cx + dx - s, ry); x.closePath(); x.fill(); }
  x.restore();
}
function grade() {
  x.save(); x.globalCompositeOperation = 'source-over';
  const v = x.createRadialGradient(W / 2, H * 0.5, Math.min(W, H) * 0.35, W / 2, H * 0.5, Math.hypot(W, H) * 0.62);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)'); x.fillStyle = v; x.fillRect(0, 0, W, H); x.restore();
  const id = x.getImageData(0, 0, W, H), d = id.data, r = rnd(5);
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 7; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  x.putImageData(id, 0, 0);
}
(async () => {
  await document.fonts.load('700 40px Cinzel'); await document.fonts.load('900 40px CinzelDeco');
  const [street, theatre, cassian, wren, odile, nell, lantern, letter] = await Promise.all(['bg_street', 'bg_theatre', 'characters_cassian', 'characters_wren', 'characters_odile', 'characters_nell', 'ui_obj_lantern', 'ui_obj_letters'].map(load));
  // Backdrop: the lamplit street, softened for depth and graded teal with a warm heart.
  x.drawImage(layer((g) => { g.filter = 'blur(5px)'; coverImg(g, street, 0.5, L === 'land' ? 0.62 : 0.5, 1.08); }), 0, 0);
  x.fillStyle = 'rgba(10,22,32,0.42)'; x.fillRect(0, 0, W, H);
  const hx = L === 'land' ? W * 0.68 : W * 0.5;
  x.save(); x.globalCompositeOperation = 'lighter';
  rg(x, hx, H * 0.4, Math.max(W, H) * 0.55, [[0, 'rgba(255,170,90,0.32)'], [0.5, 'rgba(170,70,50,0.14)'], [1, 'rgba(0,0,0,0)']]);
  // A great pale moon behind the hero.
  rg(x, hx + (L === 'land' ? 40 : 0), H * 0.3, Math.min(W, H) * 0.36, [[0, 'rgba(255,236,200,0.5)'], [0.55, 'rgba(255,226,180,0.18)'], [1, 'rgba(0,0,0,0)']]);
  x.restore();
  rays(hx + W * 0.25, -H * 0.3, 12, H * 1.6, 0.7, 0.09, 7);
  if (L === 'land') {
    // Troupe in depth, then the hero.
    fig(odile, W * 0.95, H * 0.14, H * 0.74, { blur: 3, dim: 0.7, haze: 0.45 });
    fig(cassian, W * 0.43, H * 0.12, H * 0.96, { blur: 3, dim: 0.66, haze: 0.48 });
    fireflies(14, 3, [W * 0.3, H * 0.2, W * 0.7, H * 0.6], 1.2, false);
    hero(wren, W * 0.7, H * 0.27, H * 1.18, { rim: 0.2, rimLeft: true });

    fireflies(10, 41, [0, H * 0.55, W, H * 0.45], 1.6, true);
    fireflies(36, 13, [0, H * 0.1, W, H * 0.85], 1.4, false);
    // Logo panel shading on the left so the mark sits clean.
    const sh = x.createLinearGradient(0, 0, W * 0.5, 0); sh.addColorStop(0, 'rgba(6,8,12,0.55)'); sh.addColorStop(1, 'rgba(6,8,12,0)');
    x.fillStyle = sh; x.fillRect(0, 0, W * 0.5, H);
    grade();
    logo(W * 0.24, H * 0.56, 1.05, lantern);
  } else if (L === 'port') {
    fig(odile, W * 0.12, H * 0.2, H * 0.52, { blur: 3, dim: 0.7, haze: 0.45 });
    fig(nell, W * 0.92, H * 0.17, H * 0.52, { blur: 3, dim: 0.7, haze: 0.45 });
    fig(cassian, W * 0.5, H * 0.1, H * 0.62, { blur: 3, dim: 0.66, haze: 0.48 });
    hero(wren, W * 0.5, H * 0.34, H * 0.78, { rim: 0.2, rimLeft: true });
    letters(letter, 3, 21, [0, H * 0.45, W, H * 0.3], W / 900, 2);
    fireflies(8, 41, [0, H * 0.4, W, H * 0.6], W / 1000, true);
    fireflies(28, 13, [0, H * 0.05, W, H * 0.8], W / 900, false);
    const sh = x.createLinearGradient(0, H * 0.6, 0, H); sh.addColorStop(0, 'rgba(6,8,12,0)'); sh.addColorStop(0.55, 'rgba(6,8,12,0.78)'); sh.addColorStop(1, 'rgba(6,8,12,0.9)');
    x.fillStyle = sh; x.fillRect(0, H * 0.6, W, H * 0.4);
    grade();
    logo(W * 0.5, H * 0.83, W / 1000, lantern);
  } else {
    hero(wren, W * 0.5, H * 0.3, H * 1.05, { rim: 0.2, rimLeft: true });
    fireflies(6, 41, [0, H * 0.4, W, H * 0.6], W / 1000, true);
    fireflies(22, 13, [0, H * 0.05, W, H * 0.8], W / 900, false);
    const sh = x.createLinearGradient(0, H * 0.5, 0, H); sh.addColorStop(0, 'rgba(6,8,12,0)'); sh.addColorStop(0.6, 'rgba(6,8,12,0.8)'); sh.addColorStop(1, 'rgba(6,8,12,0.9)');
    x.fillStyle = sh; x.fillRect(0, H * 0.5, W, H * 0.5);
    grade();
    logo(W * 0.5, H * 0.8, W / 1000, lantern);
  }
  document.title = 'done';
})();
</script></body></html>
